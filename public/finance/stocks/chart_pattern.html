    function renderMACDSVG(card) {
      const svgNS = "http://www.w3.org/2000/svg";
      const width = 240;
      const padX = 18;
      const priceTop = 12;
      const priceH = 148;
      const gap = 16;
      const macdH = 104;
      const height = priceTop + priceH + gap + macdH + 10;

      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const count = card.candles.length;
      const plotW = width - padX * 2;
      const step = plotW / count;
      const candleWidth = Math.min(13, step * 0.56);
      const wickWidth = 2;

      const yPrice = (val) => priceTop + priceH - (val / 100) * priceH;

      const macdTop = priceTop + priceH + gap;
      const range = 32;
      const yMacd = (val) => {
        const v = Math.max(-range, Math.min(range, val));
        return macdTop + macdH / 2 - (v / range) * (macdH / 2 - 6);
      };
      const zeroY = yMacd(0);

      const cx = (idx) => padX + idx * step + step / 2;

      const drawLine = (x1, y1, x2, y2, stroke, strokeWidth, dash) => {
        const el = document.createElementNS(svgNS, "line");
        el.setAttribute("x1", x1);
        el.setAttribute("y1", y1);
        el.setAttribute("x2", x2);
        el.setAttribute("y2", y2);
        el.setAttribute("stroke", stroke);
        el.setAttribute("stroke-width", strokeWidth);
        if (dash) el.setAttribute("stroke-dasharray", dash);
        svg.appendChild(el);
      };

      const drawDot = (x, y) => {
        const dot = document.createElementNS(svgNS, "circle");
        dot.setAttribute("cx", x);
        dot.setAttribute("cy", y);
        dot.setAttribute("r", 3.5);
        dot.setAttribute("fill", "#111111");
        svg.appendChild(dot);
      };

      // Dashed connector from the crossover candle down to the MACD cross.
      if (card.cross != null) {
        const [, high] = card.candles[card.cross];
        drawLine(cx(card.cross), yPrice(high), cx(card.cross), yMacd(card.macd[card.cross]), "#555555", 1.2, "4 3");
      }

      // Price candles (same drawing rules as renderPatternSVG).
      card.candles.forEach(([open, high, low, close], idx) => {
        const isBull = close > open;
        const isDoji = close === open;
        const color = isBull ? "#188038" : "#e11d1d";

        const centerX = cx(idx);
        const yHigh = yPrice(high);
        const yLow = yPrice(low);
        const yOpen = yPrice(open);
        const yClose = yPrice(close);

        const wick = document.createElementNS(svgNS, "line");
        wick.setAttribute("x1", centerX);
        wick.setAttribute("x2", centerX);
        wick.setAttribute("y1", yHigh);
        wick.setAttribute("y2", yLow);
        wick.setAttribute("stroke", color);
        wick.setAttribute("stroke-width", wickWidth);
        svg.appendChild(wick);

        const bodyTop = Math.min(yOpen, yClose);
        const bodyHeight = isDoji ? 2 : Math.max(2, Math.abs(yClose - yOpen));

        const body = document.createElementNS(svgNS, "rect");
        body.setAttribute("x", centerX - candleWidth / 2);
        body.setAttribute("y", isDoji ? bodyTop - 1 : bodyTop);
        body.setAttribute("width", candleWidth);
        body.setAttribute("height", bodyHeight);
        body.setAttribute("fill", color);
        svg.appendChild(body);
      });

      // Divergence trendline across the two price swings.
      if (card.priceLine) {
        const [i1, i2, which] = card.priceLine;
        const valAt = (i) => (which === "low" ? card.candles[i][2] : card.candles[i][1]);
        drawLine(cx(i1), yPrice(valAt(i1)), cx(i2), yPrice(valAt(i2)), "#111111", 1.5);
        drawDot(cx(i1), yPrice(valAt(i1)));
        drawDot(cx(i2), yPrice(valAt(i2)));
      }

      // Centerline (zero line of the MACD panel).
      drawLine(padX, zeroY, width - padX, zeroY, "#333333", 1.2);
      if (card.centerlineLabel) {
        const label = document.createElementNS(svgNS, "text");
        label.setAttribute("x", padX);
        label.setAttribute("y", zeroY - 5);
        label.setAttribute("font-size", "10");
        label.setAttribute("font-weight", "600");
        label.setAttribute("fill", "#333333");
        label.textContent = "Centerline";
        svg.appendChild(label);
      }

      // Histogram bars (MACD minus signal): green above zero, red below.
      card.macd.forEach((m, i) => {
        const h = m - card.signal[i];
        const barW = Math.min(8, step * 0.5);
        const y0 = zeroY;
        const y1 = yMacd(h);
        const bar = document.createElementNS(svgNS, "rect");
        bar.setAttribute("x", cx(i) - barW / 2);
        bar.setAttribute("y", Math.min(y0, y1));
        bar.setAttribute("width", barW);
        bar.setAttribute("height", Math.max(1, Math.abs(y1 - y0)));
        bar.setAttribute("fill", h >= 0 ? "#188038" : "#e11d1d");
        svg.appendChild(bar);
      });

      // MACD line (blue) and signal line (yellow).
      const drawSeries = (values, color) => {
        const pts = values.map((v, i) => `${cx(i)},${yMacd(v)}`).join(" ");
        const pl = document.createElementNS(svgNS, "polyline");
        pl.setAttribute("points", pts);
        pl.setAttribute("fill", "none");
        pl.setAttribute("stroke", color);
        pl.setAttribute("stroke-width", "2");
        pl.setAttribute("stroke-linejoin", "round");
        svg.appendChild(pl);
      };
      drawSeries(card.macd, "#1d4ed8");
      drawSeries(card.signal, "#eab308");

      // Divergence trendline across the two MACD swings.
      if (card.macdLine) {
        const [i1, i2] = card.macdLine;
        drawLine(cx(i1), yMacd(card.macd[i1]), cx(i2), yMacd(card.macd[i2]), "#111111", 1.5);
        drawDot(cx(i1), yMacd(card.macd[i1]));
        drawDot(cx(i2), yMacd(card.macd[i2]));
      }

      // Ring around the crossover point.
      if (card.cross != null) {
        const ring = document.createElementNS(svgNS, "circle");
        ring.setAttribute("cx", cx(card.cross));
        ring.setAttribute("cy", yMacd(card.macd[card.cross]));
        ring.setAttribute("r", 7);
        ring.setAttribute("fill", "none");
        ring.setAttribute("stroke", "#333333");
        ring.setAttribute("stroke-width", "1.5");
        svg.appendChild(ring);
      }

      return svg;
    }

    function renderPatternSVG(pattern) {
      const svgNS = "http://www.w3.org/2000/svg";
      const width = 240;
      const height = 165;
      const padX = 18;
      const padY = 12;

      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const count = pattern.candles.length;
      const plotW = width - padX * 2;
      const plotH = height - padY * 2;
      const step = plotW / count;
      const candleWidth = Math.min(15, step * 0.56);
      const wickWidth = 2;

      const yScale = (val) => padY + plotH - (val / 100) * plotH;

      if (pattern.highlight) {
        const [startIdx, endIdx] = pattern.highlight;
        let maxHigh = -Infinity;
        let minLow = Infinity;

        for (let i = startIdx; i <= endIdx; i++) {
          const [, h, l] = pattern.candles[i];
          if (h > maxHigh) maxHigh = h;
          if (l < minLow) minLow = l;
        }

        const boxPadX = 6;
        const boxPadY = 6;
        const x1 = padX + startIdx * step + (step - candleWidth) / 2 - boxPadX;
        const x2 = padX + endIdx * step + (step + candleWidth) / 2 + boxPadX;
        const y1 = yScale(maxHigh) - boxPadY;
        const y2 = yScale(minLow) + boxPadY;

        const rect = document.createElementNS(svgNS, "rect");
        rect.setAttribute("x", x1);
        rect.setAttribute("y", y1);
        rect.setAttribute("width", x2 - x1);
        rect.setAttribute("height", y2 - y1);
        rect.setAttribute("fill", "none");
        rect.setAttribute("stroke", "#333333");
        rect.setAttribute("stroke-width", "1.35");
        svg.appendChild(rect);
      }

      pattern.candles.forEach(([open, high, low, close], idx) => {
        const isBull = close > open;
        const isDoji = close === open;
        const color = isBull ? "#188038" : "#e11d1d";

        const centerX = padX + idx * step + step / 2;
        const yHigh = yScale(high);
        const yLow = yScale(low);
        const yOpen = yScale(open);
        const yClose = yScale(close);

        const wick = document.createElementNS(svgNS, "line");
        wick.setAttribute("x1", centerX);
        wick.setAttribute("x2", centerX);
        wick.setAttribute("y1", yHigh);
        wick.setAttribute("y2", yLow);
        wick.setAttribute("stroke", color);
        wick.setAttribute("stroke-width", wickWidth);
        svg.appendChild(wick);

        const bodyTop = Math.min(yOpen, yClose);
        const bodyHeight = isDoji ? 2 : Math.max(2, Math.abs(yClose - yOpen));

        const body = document.createElementNS(svgNS, "rect");
        body.setAttribute("x", centerX - candleWidth / 2);
        body.setAttribute("y", isDoji ? bodyTop - 1 : bodyTop);
        body.setAttribute("width", candleWidth);
        body.setAttribute("height", bodyHeight);
        body.setAttribute("fill", color);
        svg.appendChild(body);
      });

      return svg;
    }

    const grid = document.getElementById("chart-grid");
    PATTERNS.forEach((pattern) => {
      const card = document.createElement("div");
      card.className = "pattern-card";

      const svg = renderPatternSVG(pattern);
      const label = document.createElement("div");
      label.className = "pattern-title";
      label.textContent = pattern.title;

      card.appendChild(svg);
      card.appendChild(label);

      const desc = document.createElement("div");
      desc.className = "pattern-desc";
      desc.textContent = pattern.description;
      card.appendChild(desc);
      grid.appendChild(card);
    });

    const MACD_ROWS = {
      "Signal Line Crossover": document.getElementById("macd-crossover"),
      "Divergence": document.getElementById("macd-divergence"),
      "Centerline Crossover": document.getElementById("macd-centerline")
    };

    MACD_SIGNALS.forEach((signal) => {
      const card = document.createElement("div");
      card.className = "pattern-card";

      const label = document.createElement("div");
      label.className = "signal-label " + (signal.side === "bullish" ? "bull" : "bear");
      label.textContent = signal.side === "bullish" ? "Bullish Signal" : "Bearish Signal";
      card.appendChild(label);

      card.appendChild(renderMACDSVG(signal));

      const title = document.createElement("div");
      title.className = "pattern-title";
      title.textContent = signal.type;
      card.appendChild(title);

      const desc = document.createElement("div");
      desc.className = "pattern-desc";
      desc.textContent = signal.rule;
      card.appendChild(desc);

      const chip = document.createElement("div");
      chip.className = "action-chip " + (signal.side === "bullish" ? "bull" : "bear");
      chip.textContent = signal.action;
      card.appendChild(chip);

      MACD_ROWS[signal.type].appendChild(card);
    });
  </script>

  <script>
    // Curtains wipe transition (vanilla). Intercepts only plain left-clicks
    // on same-origin links: no modifiers, no middle-click, no target=_blank,
    // no anchor-only or download links. Reduced motion: instant navigation.
    (function () {
      var wipe = document.querySelector(".wipe");
      if (!wipe) return;

      function reveal() {
        document.documentElement.classList.remove("wipe-in");
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () { requestAnimationFrame(reveal); });
      } else {
        requestAnimationFrame(reveal);
      }
      // bfcache restore: a page left covered must come back uncovered.
      window.addEventListener("pageshow", function (e) {
        if (e.persisted) {
          wipe.classList.remove("cover");
          document.documentElement.classList.remove("wipe-in");
        }
      });

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      document.addEventListener("click", function (event) {
        if (event.defaultPrevented || event.button !== 0
            || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        if (wipe.classList.contains("cover")) return;
        var a = event.target && event.target.closest ? event.target.closest("a") : null;
        if (!a || a.target === "_blank" || a.hasAttribute("download")) return;
        var href = a.getAttribute("href");
        if (!href || href.charAt(0) === "#") return;
        var url;
        try { url = new URL(href, location.href); } catch (err) { return; }
        if (url.origin !== location.origin) return;
        if (url.pathname === location.pathname && url.search === location.search) return;
        event.preventDefault();
        try { sessionStorage.setItem("bm-wipe", "1"); } catch (err) {}
        var done = false;
        function go() { if (!done) { done = true; location.href = url.href; } }
        var fallback = setTimeout(go, 600);
        var last = wipe.children[wipe.children.length - 1];
        if (last) {
          last.addEventListener("transitionend", function () { clearTimeout(fallback); go(); }, { once: true });
        }
        wipe.classList.add("cover");
      });
    })();
  </script>
</body>
