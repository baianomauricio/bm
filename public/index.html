  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #fafafa;
      color: #222;
      text-align: center;
      padding: 25px 1rem 1rem;
    }
    h1 { font-weight: 300; letter-spacing: 0.15em; }
    .profile-photo {
      display: block;
      width: 300px;
      height: 300px;
      object-fit: cover;
      border-radius: 50% 20% 50% 50%;
      filter: drop-shadow(-8px 8px 12px rgba(0, 0, 0, 0.25));
      margin: 0 auto 1.5rem;
    }
    p { color: #777; }

    /* Hobby → Finance launcher: trigger morphs into the menu grid.
       The trigger and menu are built by the script below; without JS
       this mount point stays empty and the page is unchanged. */
    .launcher {
      margin: 2rem auto 0;
      width: 100%;
      max-width: 480px;
    }
    .launcher-trigger {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font: inherit;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      color: #222;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 999px;
      padding: 0.85rem 1.6rem;
      cursor: pointer;
    }
    .launcher-trigger:hover { border-color: #bbb; }
    .launcher-trigger:focus-visible { outline: 2px solid #222; outline-offset: 2px; }
    .launcher-icon {
      display: inline-block;
      font-weight: 300;
      transition: transform 200ms ease;
    }
    .launcher.open .launcher-icon { transform: rotate(45deg); }
    .launcher-menu {
      margin-top: 1.25rem;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 16px;
      text-align: left;
      overflow: hidden;
      clip-path: inset(0 0 100% 0 round 16px);
      opacity: 0;
      transform: translateY(-6px);
      visibility: hidden;
      transition: clip-path 220ms ease, opacity 220ms ease, transform 220ms ease, visibility 0s linear 220ms;
    }
    .launcher.open .launcher-menu {
      clip-path: inset(0 0 0% 0 round 16px);
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
      transition: clip-path 220ms ease, opacity 220ms ease, transform 220ms ease, visibility 0s;
    }
    .launcher-menu[hidden] { display: none; }
    .launcher-menu ul {
      list-style: none;
      margin: 0;
      padding: 1.5rem 1.75rem;
      display: grid;
      gap: 1.5rem;
    }
    .launcher-menu a {
      display: block;
      padding: 0.35rem 0.5rem;
      border-radius: 8px;
      color: #222;
      text-decoration: none;
      font-size: 1.05rem;
      line-height: 1.4;
    }
    .launcher-menu a:hover,
    .launcher-menu a:focus-visible { background: #f0f0f0; outline: none; }
    @media (prefers-reduced-motion: reduce) {
      .launcher-menu,
      .launcher-icon { transition: none; }
    }

    /* Fixed breadcrumb bar (site-wide): 25px, full width, above content.
       The bar scrolls horizontally on narrow screens; the page itself
       never gains horizontal overflow. */
    .breadcrumb-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 25px; z-index: 100;
      display: flex; align-items: center; gap: 8px; padding: 0 12px;
      overflow-x: auto; white-space: nowrap; scrollbar-width: none;
      background: #fafafa; border-bottom: 1px solid #ddd;
      font-size: 12px; line-height: 25px;
    }
    .breadcrumb-bar::-webkit-scrollbar { display: none; }
    .breadcrumb-bar a { color: #234f86; text-underline-offset: .17em; }
    .breadcrumb-bar a:hover { color: #102f58; }
    .breadcrumb-bar a:focus-visible { outline: 2px solid #234f86; outline-offset: 2px; }

    /* Curtains wipe transition (vanilla, JS-only). Without JS the overlay
       stays hidden and navigation is plain. Transform-only panels
       (composited); the curtain sits above the breadcrumb bar. */
    .wipe { position: fixed; inset: 0; z-index: 200; display: flex; pointer-events: none; visibility: hidden; transition: visibility 0s linear 480ms; }
    .wipe-panel { flex: 1; background: #111; transform: translateY(-120%) skewY(12deg); transition: transform 350ms ease; height: calc(100% + 14.2vw); margin-top: -7.1vw; }
    .wipe-panel:nth-child(2) { transition-delay: 60ms; }
    .wipe-panel:nth-child(3) { transition-delay: 120ms; }
    .wipe.cover { visibility: visible; transition: none; }
    .wipe.cover .wipe-panel { transform: translateY(0) skewY(12deg); }
    html.wipe-in .wipe { visibility: visible; }
    html.wipe-in .wipe-panel { transform: translateY(0) skewY(12deg); }
    @media (prefers-reduced-motion: reduce) {
      .wipe-panel { transition: none; }
    }
  </style>

  <script>
    // Wipe arrival: if the previous page set the flag, start covered; the
    // main script at the end of <body> lifts the curtain once ready.
    // The flag is consumed on every load; reduced motion skips the cover.
    try {
      if (sessionStorage.getItem("bm-wipe") === "1") {
        sessionStorage.removeItem("bm-wipe");
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.classList.add("wipe-in");
        }
      }
    } catch (e) { /* storage unavailable — plain load, no wipe */ }
  </script>

  <main>
    <img class="profile-photo" src="/my-photo.jpg" alt="Mauricio Baiano" width="300" height="300">
    <h1>Mauricio Baiano</h1>
    <p>A new personal site is on its way. Stay tuned. You can catch-up on my hobbies for now.</p>
    <div class="launcher" id="launcher"></div>
    <p style="margin-top:2rem;font-size:0.8rem;color:#aaa">&copy; 2026</p>
  </main>

  <script>
    // Hobby → Finance launcher (FR-01–FR-06). Vanilla JS + CSS only — the
    // change request's React/Motion references are pattern inspiration.
    // Links are data-driven (FR-03): adding a page is one array entry.
    // Finance pages only — the AI pages are a separate group later.
    const FINANCE_LINKS = [
      { label: "Candlestick Patterns & MACD Signals", href: "/finance/stocks/chart_pattern.html" },
      { label: "S&P 500 Returns After Major World Events", href: "/finance/stocks/market_recovery.html" }
    ];

    const launcher = document.getElementById("launcher");

    const trigger = document.createElement("button");
    trigger.className = "launcher-trigger";
    trigger.type = "button";
    trigger.setAttribute("aria-expanded", "false");
    trigger.setAttribute("aria-controls", "launcher-menu");

    const triggerLabel = document.createElement("span");
    triggerLabel.textContent = "Hobby → Finance";
    trigger.appendChild(triggerLabel);

    const triggerIcon = document.createElement("span");
    triggerIcon.className = "launcher-icon";
    triggerIcon.setAttribute("aria-hidden", "true");
    triggerIcon.textContent = "+";
    trigger.appendChild(triggerIcon);

    const menu = document.createElement("div");
    menu.className = "launcher-menu";
    menu.id = "launcher-menu";
    menu.hidden = true;

    const list = document.createElement("ul");
    const linkEls = FINANCE_LINKS.map((entry) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = entry.href;
      a.textContent = entry.label;
      li.appendChild(a);
      list.appendChild(li);
      return a;
    });
    menu.appendChild(list);

    launcher.appendChild(trigger);
    launcher.appendChild(menu);

    let expanded = false;

    function prefersReducedMotion() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function expand() {
      expanded = true;
      trigger.setAttribute("aria-expanded", "true");
      menu.hidden = false;
      // Next frame so the clip-path transition runs from the collapsed state.
      requestAnimationFrame(() => launcher.classList.add("open"));
      if (linkEls[0]) linkEls[0].focus();
    }

    function collapse(returnFocus) {
      expanded = false;
      trigger.setAttribute("aria-expanded", "false");
      launcher.classList.remove("open");
      if (prefersReducedMotion()) {
        menu.hidden = true;
      } else {
        menu.addEventListener("transitionend", function hideMenu() {
          menu.hidden = true;
        }, { once: true });
      }
      if (returnFocus) trigger.focus();
    }

    trigger.addEventListener("click", () => {
      if (expanded) collapse(true);
      else expand();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && expanded) collapse(true);
    });

    document.addEventListener("click", (event) => {
      if (expanded && !launcher.contains(event.target)) collapse(true);
    });
  </script>

  <script>
    // Curtains wipe transition (vanilla). Intercepts only plain left-clicks
    // on same-origin links: no modifiers, no middle-click, no target=_blank,
    // no anchor-only or download links. Reduced motion: instant navigation.
    (function () {
      var wipe = document.querySelector(".wipe");
      if (!wipe) return;

      function reveal() {
        document.documentElement.classList.remove("wipe-in");
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () { requestAnimationFrame(reveal); });
      } else {
        requestAnimationFrame(reveal);
      }
      // bfcache restore: a page left covered must come back uncovered.
      window.addEventListener("pageshow", function (e) {
        if (e.persisted) {
          wipe.classList.remove("cover");
          document.documentElement.classList.remove("wipe-in");
        }
      });

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      document.addEventListener("click", function (event) {
        if (event.defaultPrevented || event.button !== 0
            || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        if (wipe.classList.contains("cover")) return;
        var a = event.target && event.target.closest ? event.target.closest("a") : null;
        if (!a || a.target === "_blank" || a.hasAttribute("download")) return;
        var href = a.getAttribute("href");
        if (!href || href.charAt(0) === "#") return;
        var url;
        try { url = new URL(href, location.href); } catch (err) { return; }
        if (url.origin !== location.origin) return;
        if (url.pathname === location.pathname && url.search === location.search) return;
        event.preventDefault();
        try { sessionStorage.setItem("bm-wipe", "1"); } catch (err) {}
        var done = false;
        function go() { if (!done) { done = true; location.href = url.href; } }
        var fallback = setTimeout(go, 600);
        var last = wipe.children[wipe.children.length - 1];
        if (last) {
          last.addEventListener("transitionend", function () { clearTimeout(fallback); go(); }, { once: true });
        }
        wipe.classList.add("cover");
      });
    })();
  </script>
